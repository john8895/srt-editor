<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT Editor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2322c55e'/><text x='50' y='68' font-size='50' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'>S</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .toolbar h1 {
      font-size: 15px;
      font-weight: 600;
      margin-right: 8px;
      color: #16a34a;
    }
    .btn {
      padding: 5px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      background: #fff;
      color: #555;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }
    .btn:hover { background: #f0f0f0; }
    .btn.primary { background: #22c55e; border-color: #22c55e; color: #fff; font-weight: 600; }
    .btn.primary:hover { background: #16a34a; }
    .spacer { flex: 1; }
    .file-info { font-size: 11px; color: #999; }

    /* ── Waveform (full width, top) ── */
    .waveform-section {
      flex-shrink: 0;
      padding: 10px 16px 6px;
      background: #f5f5f5;
    }
    #waveform-timeline {
      background: #fff;
      border-radius: 4px 4px 0 0;
      border: 1px solid #e0e0e0;
      border-bottom: none;
      cursor: pointer;
      user-select: none;
    }
    #waveform {
      border-radius: 0 0 6px 6px;
      overflow-x: auto;
      overflow-y: hidden;
      background: #e8e8e8;
      padding-right: 8px;
    }

    /* ── Playback bar ── */
    .playback-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #22c55e;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .play-btn:hover { background: #16a34a; }
    .time-display {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 12px;
      color: #888;
    }
    .bar-control {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #888;
    }
    .bar-control select {
      background: #fff;
      color: #555;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 11px;
    }
    .bar-control input[type="range"] {
      width: 100px;
      accent-color: #22c55e;
    }

    /* ── Main content: video left + subtitles right ── */
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    /* Video panel */
    .video-panel {
      display: none;
      flex-shrink: 0;
      background: #111;
      flex-direction: column;
    }
    .video-panel.visible {
      display: flex;
    }
    .video-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      min-height: 0;
    }
    .video-area video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .video-subtitle {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 4px;
      max-width: 92%;
      text-align: center;
      pointer-events: none;
      white-space: pre-line;
      display: none;
      letter-spacing: 0.5px;
    }
    .video-subtitle.visible { display: block; }
    .speed-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .speed-toast.visible { opacity: 1; }
    /* ── Subtitle status bar (bottom of subtitle panel) ── */
    .subtitle-status {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 6px 12px;
      background: #f0f0f0;
      border-top: 1px solid #e0e0e0;
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 11px;
      color: #666;
      flex-shrink: 0;
    }
    .subtitle-status .info-label { color: #999; }
    .subtitle-status .info-value { color: #333; }

    /* Subtitle panel */
    .subtitle-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #fafafa;
      border-left: 1px solid #e0e0e0;
    }
    .subtitle-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-row .match-count {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      font-family: 'SF Mono', 'Menlo', monospace;
    }
    .replace-row {
      display: none;
      align-items: center;
      gap: 8px;
    }
    .replace-row.visible { display: flex; }
    .replace-row input {
      flex: 1;
      background: #f5f5f5;
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      color: #333;
      padding: 5px 10px;
      font-size: 12px;
    }
    .replace-row input:focus { border-color: #22c55e; outline: none; }
    .replace-row .arrow-label {
      font-size: 12px;
      color: #aaa;
      flex-shrink: 0;
    }
    .subtitle-header .search-input {
      flex: 1;
      background: #f5f5f5;
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      color: #333;
      padding: 5px 10px;
      font-size: 12px;
    }
    .subtitle-header .search-input::placeholder { color: #aaa; }
    .subtitle-header .search-input:focus { border-color: #22c55e; outline: none; }
    .search-clear {
      background: none;
      border: none;
      color: #aaa;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      display: none;
    }
    .search-clear:hover { color: #555; }
    .search-clear.visible { display: block; }

    .subtitle-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .subtitle-list::-webkit-scrollbar { width: 6px; }
    .subtitle-list::-webkit-scrollbar-track { background: transparent; }
    .subtitle-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    .subtitle-item {
      display: grid;
      grid-template-columns: 32px 1fr auto 32px 28px;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      cursor: pointer;
      transition: background 0.1s;
      border-left: 3px solid transparent;
    }
    .subtitle-item:hover { background: #f0f0f0; }
    .subtitle-item.active {
      background: rgba(34, 197, 94, 0.08);
      border-left-color: #22c55e;
    }
    .subtitle-item .index {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      font-family: 'SF Mono', 'Menlo', monospace;
    }
    .subtitle-item .sub-text-display {
      font-size: 13px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: text;
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    .subtitle-item .sub-text-display:hover {
      border-color: #d0d0d0;
      background: #fff;
    }
    .subtitle-item .sub-text-display:focus {
      outline: none;
      border-color: #22c55e;
      background: #fff;
      white-space: normal;
      cursor: text;
    }
    .subtitle-item.active .sub-text-display { color: #111; font-weight: 500; }
    .subtitle-item .sub-time {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 10px;
      color: #aaa;
      white-space: nowrap;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      transition: background 0.15s, color 0.15s;
    }
    .subtitle-item .sub-time:hover {
      background: #e8e8e8;
      color: #555;
    }
    .subtitle-item .sub-text-display mark {
      background: #fde047;
      color: #111;
      border-radius: 2px;
      padding: 0 1px;
    }
    .subtitle-item .char-count {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 10px;
      color: #aaa;
      text-align: right;
    }
    .subtitle-item .char-count.over { color: #ef4444; font-weight: 600; }
    .subtitle-item .delete-btn {
      background: none;
      border: none;
      color: transparent;
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
      border-radius: 3px;
      transition: color 0.15s;
    }
    .subtitle-item:hover .delete-btn { color: #bbb; }
    .subtitle-item .delete-btn:hover { color: #ef4444; }

    /* ── Edit drawer ── */
    .edit-drawer {
      display: none;
      padding: 10px 12px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      flex-shrink: 0;
      gap: 8px;
    }
    .edit-drawer.visible {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .edit-drawer .edit-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .edit-drawer label {
      font-size: 11px;
      color: #888;
      width: 32px;
      flex-shrink: 0;
    }
    .edit-drawer .time-input {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 12px;
      background: #f5f5f5;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      color: #333;
      padding: 4px 8px;
      width: 130px;
      text-align: center;
    }
    .edit-drawer .time-input:focus { border-color: #22c55e; outline: none; }
    .edit-drawer .text-input {
      font-size: 13px;
      background: #f5f5f5;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      color: #333;
      padding: 4px 8px;
      flex: 1;
    }
    .edit-drawer .text-input:focus { border-color: #22c55e; outline: none; }
    .edit-drawer .arrow { color: #aaa; font-size: 11px; }
    .edit-drawer .hint { font-size: 10px; color: #aaa; margin-left: 4px; }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: #bbb;
      gap: 10px;
    }
    .empty-state .icon { font-size: 40px; opacity: 0.5; }
    .empty-state p { font-size: 13px; }

    /* ── Drop overlay ── */
    .drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(34, 197, 94, 0.08);
      border: 3px dashed #22c55e;
      z-index: 100;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #22c55e;
    }
    .drop-overlay.visible { display: flex; }

    /* ── Loading overlay ── */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .loading-overlay.visible { display: flex; }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: #fff;
      font-size: 14px;
    }

    /* ── Cut detect button active state ── */
    .btn.active {
      background: #22c55e;
      border-color: #22c55e;
      color: #fff;
    }
    .btn.active:hover {
      background: #16a34a;
    }

    /* ── Waveform wrapper for overlay ── */
    .waveform-wrapper {
      position: relative;
    }
    .cut-markers-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: 6px;
    }

    /* ── Cut point markers ── */
    .cut-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
      border-left: 1.5px dashed #ef4444;
      pointer-events: none;
      z-index: 3;
      opacity: 0.6;
    }

    /* ── Region styling on waveform ── */
    #waveform [data-part="region-content"],
    #waveform ::part(region-content) {
      font-size: 10px;
      color: #fff;
      background: rgba(0,0,0,0.65);
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      pointer-events: none;
    }

    /* ── Footer shortcuts ── */
    .shortcuts-bar {
      padding: 5px 16px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      font-size: 10px;
      color: #aaa;
      flex-shrink: 0;
      display: flex;
      gap: 14px;
    }
    .shortcuts-bar kbd {
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      border-radius: 3px;
      padding: 1px 4px;
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 9px;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Toolbar -->
  <div class="toolbar">
    <h1>SRT Editor</h1>
    <button class="btn" id="btn-load-media">載入媒體</button>
    <button class="btn" id="btn-load-srt">載入 SRT</button>
    <div class="spacer"></div>
    <span class="file-info" id="file-info"></span>
    <button class="btn primary" id="btn-export" disabled>匯出 SRT</button>
  </div>

  <!-- Waveform (full width) -->
  <div class="waveform-section">
    <div id="waveform-timeline"></div>
    <div class="waveform-wrapper" id="waveform-wrapper">
      <div id="waveform"></div>
      <div class="cut-markers-overlay" id="cut-markers-overlay"></div>
    </div>
  </div>

  <!-- Playback bar -->
  <div class="playback-bar">
    <button class="play-btn" id="btn-play">▶</button>
    <span class="time-display" id="time-display">00:00.000 / 00:00.000</span>
    <div class="bar-control">
      <span>速度</span>
      <select id="speed-select">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
      </select>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btn-auto-split" disabled>自動斷句</button>
    <button class="btn" id="btn-align-audio" disabled>對齊聲音</button>
    <button class="btn" id="btn-cut-detect" disabled>切點偵測</button>
    <button class="btn" id="btn-prev-sub" title="上一段" style="display:none">◀</button>
    <button class="btn" id="btn-snap-one" title="對齊此段" style="display:none">對齊</button>
    <button class="btn" id="btn-next-sub" title="下一段" style="display:none">▶</button>
    <button class="btn" id="btn-snap-all" style="display:none">自動修正</button>
    <div class="bar-control">
      <span>縮放</span>
      <input type="range" id="zoom-slider" min="1" max="500" value="1">
    </div>
  </div>

  <!-- Main content: video + subtitle list -->
  <div class="main-content">
    <div class="video-panel" id="video-panel">
      <div class="video-area">
        <video id="video-preview" playsinline controls></video>
        <div class="video-subtitle" id="video-subtitle"></div>
        <div class="speed-toast" id="speed-toast"></div>
      </div>
    </div>

    <div class="subtitle-panel">
      <div class="subtitle-header">
        <div class="search-row">
          <input class="search-input" id="search-input" type="text" placeholder="搜尋字幕...">
          <button class="search-clear" id="search-clear" title="清除">×</button>
          <span class="match-count" id="match-count"></span>
        </div>
        <div class="replace-row" id="replace-row">
          <span class="arrow-label">→</span>
          <input type="text" id="replace-input" placeholder="取代為...">
          <button class="btn" id="btn-replace-all">全部取代</button>
        </div>
      </div>
      <div class="subtitle-list" id="subtitle-list">
        <div class="empty-state" id="empty-state">
          <div class="icon">🎬</div>
          <p>拖放影片／音檔 + SRT 到視窗</p>
        </div>
      </div>
      <div class="subtitle-status" id="subtitle-status">
        <span><span class="info-value" id="info-start">--:--</span></span>
        <span><span class="info-value" id="info-duration">--</span></span>
        <span><span class="info-value" id="info-chars">--</span></span>
      </div>
      <div class="edit-drawer" id="edit-drawer">
        <div class="edit-row">
          <label>時間</label>
          <input class="time-input" id="edit-start" type="text">
          <span class="arrow">→</span>
          <input class="time-input" id="edit-end" type="text">
        </div>
        <div class="edit-row">
          <label>文字</label>
          <input class="text-input" id="edit-text" type="text">
          <span class="hint">Enter 斷句</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="shortcuts-bar">
    <span><kbd>Space</kbd> 播放</span>
    <span><kbd>←</kbd><kbd>→</kbd> ±5s</span>
    <span><kbd>⌘Z</kbd> 復原</span>
    <span><kbd>⌘⇧Z</kbd> 重做</span>
    <span><kbd>Del</kbd> 刪除字幕</span>
    <span><kbd>⌘S</kbd> 匯出</span>
    <span style="flex:1"></span>
    <a href="https://github.com/john8895/srt-editor" target="_blank" style="color:#aaa;text-decoration:none;">GitHub</a>
  </div>

  <div class="drop-overlay" id="drop-overlay">拖放影片／音檔或 SRT</div>
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">載入中...</div>
  </div>

  <input type="file" id="input-media" accept="audio/*,video/*,.mp4,.mov,.webm,.mkv,.avi" hidden>
  <input type="file" id="input-srt" accept=".srt" hidden>

  <script type="module">
    import WaveSurfer from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@7/dist/wavesurfer.esm.js'
    import RegionsPlugin from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@7/dist/plugins/regions.esm.js'
    import TimelinePlugin from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@7/dist/plugins/timeline.esm.js'

    // ── State ──
    let subtitles = []
    let activeRegion = null
    let wavesurfer = null
    let regions = null
    let srtFileName = 'output'

    // ── Undo/Redo ──
    const undoStack = []
    let historyIndex = -1
    const MAX_HISTORY = 100

    function snapshotState() {
      return JSON.parse(JSON.stringify(subtitles))
    }

    function pushHistory() {
      undoStack.splice(historyIndex + 1)
      undoStack.push(snapshotState())
      if (undoStack.length > MAX_HISTORY) undoStack.shift()
      historyIndex = undoStack.length - 1
    }

    function undo() {
      if (historyIndex <= 0) return
      historyIndex--
      restoreState(undoStack[historyIndex])
    }

    function redo() {
      if (historyIndex >= undoStack.length - 1) return
      historyIndex++
      restoreState(undoStack[historyIndex])
    }

    function restoreState(snapshot) {
      subtitles = JSON.parse(JSON.stringify(snapshot))
      renderSubtitleList()
      if (regions) renderRegions()
      closeEditDrawer()
    }

    // ── Snapping + overlap prevention ──
    // 磁吸目標：游標線位置 + 相鄰字幕邊界
    // 重疊防止：不允許兩條字幕在時間上重疊
    const SNAP_THRESHOLD = 0.08

    function getSnapTargets(regionId) {
      const targets = []

      // 1) 游標線位置（最重要的磁吸目標）
      if (wavesurfer) {
        targets.push(wavesurfer.getCurrentTime())
      }

      // 2) 相鄰字幕邊界
      for (const other of subtitles) {
        if (other.id === regionId) continue
        targets.push(other.start)
        targets.push(other.end)
      }

      // 3) 切點偵測的位置
      if (cutMarkersVisible) {
        for (const marker of cutMarkers) {
          targets.push(marker.time)
        }
      }

      return targets
    }

    function clampAndSnap(regionId, start, end, keepDuration) {
      const others = subtitles.filter(s => s.id !== regionId).sort((a, b) => a.start - b.start)
      const duration = end - start
      const targets = getSnapTargets(regionId)

      // 1) Snap edges to targets (游標、相鄰字幕、切點)
      for (const t of targets) {
        if (Math.abs(start - t) < SNAP_THRESHOLD) {
          start = t
          if (keepDuration) end = start + duration
        }
        if (Math.abs(end - t) < SNAP_THRESHOLD) {
          end = t
          if (keepDuration) start = end - duration
        }
      }

      // 2) Prevent overlap (不可重疊)
      for (const other of others) {
        if (start < other.end && end > other.start) {
          if (keepDuration) {
            const pushRight = other.end - start
            const pushLeft = end - other.start
            if (pushRight <= pushLeft) {
              start = other.end
              end = start + duration
            } else {
              end = other.start
              start = end - duration
            }
          } else {
            if (start < other.end && start > other.start) start = other.end
            if (end > other.start && end < other.end) end = other.start
          }
        }
      }

      // 3) Don't go below 0
      if (start < 0) { start = 0; if (keepDuration) end = duration }

      return { start, end }
    }

    // ── SRT parsing ──
    function parseSRT(text) {
      const blocks = text.trim().replace(/\r\n/g, '\n').split(/\n\n+/)
      const result = []
      for (const block of blocks) {
        const lines = block.split('\n')
        if (lines.length < 2) continue
        const timeMatch = lines.find(l => l.includes('-->'))
        if (!timeMatch) continue
        const timeIndex = lines.indexOf(timeMatch)
        const index = parseInt(lines[0]) || result.length + 1
        const [startStr, endStr] = timeMatch.split('-->').map(s => s.trim())
        const textLines = lines.slice(timeIndex + 1).join('\n')
        result.push({
          id: `sub-${index}`,
          index,
          start: srtTimeToSeconds(startStr),
          end: srtTimeToSeconds(endStr),
          text: textLines,
        })
      }
      return result
    }

    function srtTimeToSeconds(str) {
      const [time, ms] = str.split(/[,.]/)
      const [h, m, s] = time.split(':').map(Number)
      return h * 3600 + m * 60 + s + parseInt(ms) / 1000
    }

    function secondsToSrtTime(sec) {
      const h = Math.floor(sec / 3600)
      const m = Math.floor((sec % 3600) / 60)
      const s = Math.floor(sec % 60)
      const ms = Math.round((sec % 1) * 1000)
      return `${pad(h)}:${pad(m)}:${pad(s)},${pad3(ms)}`
    }

    function shortTime(sec) {
      const m = Math.floor(sec / 60)
      const s = Math.floor(sec % 60)
      const ms = Math.floor((sec % 1) * 100)
      return `${m}:${pad(s)}.${pad(ms)}`
    }

    function pad(n) { return n.toString().padStart(2, '0') }
    function pad3(n) { return n.toString().padStart(3, '0') }

    // ── SRT export ──
    function exportSRT() {

      sorted.forEach((sub, i) => {

        output += `${secondsToSrtTime(sub.start)} --> ${secondsToSrtTime(sub.end)}\n`
        output += `${sub.text}\n\n`
      })
      return output.trim() + '\n'
    }

    // ── Silence / cut point detection ──
    let cutMarkers = []       // { time } array
    let cutMarkersVisible = false
    let cutMarkerEls = []     // DOM elements

    async function detectSilence() {
      if (!wavesurfer) return []

      // Get the decoded audio data from wavesurfer
      const audioData = wavesurfer.getDecodedData()
      if (!audioData) return []

      const channel = audioData.getChannelData(0)
      const sampleRate = audioData.sampleRate

      // Parameters
      const windowSize = Math.floor(sampleRate * 0.03)  // 30ms window
      const silenceThreshold = 0.015  // RMS threshold
      const minSilenceDuration = 0.2  // minimum 200ms silence to count as a cut

      // Calculate RMS for each window
      const silenceRegions = []
      let inSilence = false
      let silenceStart = 0

      for (let i = 0; i < channel.length; i += windowSize) {
        let sum = 0
        const end = Math.min(i + windowSize, channel.length)
        for (let j = i; j < end; j++) {
          sum += channel[j] * channel[j]
        }
        const rms = Math.sqrt(sum / (end - i))
        const time = i / sampleRate

        if (rms < silenceThreshold) {
          if (!inSilence) {
            inSilence = true
            silenceStart = time
          }
        } else {
          if (inSilence) {
            const silenceDuration = time - silenceStart
            if (silenceDuration >= minSilenceDuration) {
              // Cut point = middle of the silence
              silenceRegions.push({ time: silenceStart + silenceDuration / 2 })
            }
            inSilence = false
          }
        }
      }

      return silenceRegions
    }

    function findNearestCut(time) {
      if (cutMarkers.length === 0) return time
      let nearest = cutMarkers[0].time
      let minDist = Math.abs(time - nearest)
      for (const marker of cutMarkers) {
        const dist = Math.abs(time - marker.time)
        if (dist < minDist) {
          minDist = dist
          nearest = marker.time
        }
      }
      return nearest
    }

    function snapSubToCuts(sub) {
      const newStart = findNearestCut(sub.start)
      const newEnd = findNearestCut(sub.end)
      // Only snap if the cut point is reasonably close (within 1 second)

      if (Math.abs(newEnd - sub.end) < 1.0) sub.end = newEnd
    }

    // ── 對齊聲音：把字幕逐段重新對齊到語音 ──
    // 這不是真的 forced alignment（純前端沒有 ASR 可比對發音）。
    // 做法：偵測語音段 → DP 把字幕依字數分配到語音段 → 段內按字數比例切時間。
    // ⚠️ 這套演算法在產線也有一份：video_pipeline/scripts/align_srt.py
    //    （pipeline Step 1B+ 自動跑）。參數刻意保持一致——改這裡要想那裡，
    //    否則同一份 SRT 在編輯器跟產線會得到不同結果。
    // 跟「自動修正」的差別：那支是每條字幕的起訖各自吸附 1 秒內最近的切點，
    // 整體漂移超過 1 秒就修不動，而且起訖獨立吸附會交叉。這支保序、不交叉，
    // 整體漂移與局部錯位一起修。字幕斷句本身錯的地方修不回來（那要改文字）。
    const ALIGN = {
      WIN: 0.03,            // RMS 視窗 30ms
      MERGE_GAP: 0.20,      // 間隔小於此值的語音段合併（句中換氣不算斷句）
      MIN_SEG: 0.15,        // 短於此值的語音段丟掉（咳嗽、雜音）
      PAD: 0.06,            // 語音段前後各留一點，避免切掉字頭
      MAX_SUBS_PER_SEG: 8,  // 一個語音段最多塞幾條字幕（Whisper 把一句切成好幾條）
      MAX_SEGS_PER_SUB: 4,  // 一組字幕最多吃幾個語音段（一句話中間換氣被切開）
      MERGE_COST: 0.15,     // 每多吃一段的成本，免得無腦合併
      BAND_RATIO: 0.12,     // DP 搜尋帶寬（佔字幕數比例）
      BAND_MIN: 60,
      OFFSET_RANGE: 12,     // 全域偏移搜尋範圍（秒）
      OFFSET_STEP: 0.1,
      TIME_WEIGHT: 0.35,    // 「貼近原始時間」的軟約束權重（實測調高反而更差，見檔頭註解）
      MAX_SHIFT: 2.5,       // 單條字幕最大位移（秒）；超過幾乎都是對齊崩了，寧可不動
      SHIFT_RELAX: [2.5, 5, 10, 0],  // DP 無解時逐步放寬，0 = 不限制
      EMPTY_SEG_COST: 0.6,  // 語音段沒分到字幕的懲罰（每秒）
      GAP_FILL: 0.3,        // 相鄰字幕間隔小於此值就補滿，避免閃爍
      MIN_DUR: 0.25,        // 每條字幕最短時長
      MAX_CELLS: 4e6,         // DP 格子上限，超過就退回等比例映射
    }

    function alignCharCount(text) {
      return (text || '').replace(/\s/g, '').length
    }

    // 1. 偵測語音段（不是切點，是「這段在講話」的區間）
    function detectSpeechSegments() {
      const audioData = wavesurfer && wavesurfer.getDecodedData()
      if (!audioData) return null

      const channel = audioData.getChannelData(0)
      const sampleRate = audioData.sampleRate
      const win = Math.max(1, Math.floor(sampleRate * ALIGN.WIN))
      const n = Math.floor(channel.length / win)
      if (n < 2) return null

      const rms = new Float32Array(n)
      for (let w = 0; w < n; w++) {
        let sum = 0
        const s = w * win
        for (let j = s; j < s + win; j++) sum += channel[j] * channel[j]
        rms[w] = Math.sqrt(sum / win)
      }

      // 自適應門檻：固定 0.015 在不同錄音上會整個偏掉，所以從分位數推
      const sorted = Float32Array.from(rms).sort()
      const pct = p => sorted[Math.min(n - 1, Math.max(0, Math.floor(n * p)))]
      const floorLv = pct(0.10)
      const speechLv = pct(0.90)
      const threshold = Math.max(floorLv + (speechLv - floorLv) * 0.10, floorLv * 1.8, 1e-5)

      const raw = []
      let inSpeech = false
      let segStart = 0
      for (let w = 0; w < n; w++) {
        const t = (w * win) / sampleRate
        if (rms[w] >= threshold) {
          if (!inSpeech) { inSpeech = true; segStart = t }
        } else if (inSpeech) {
          inSpeech = false
          raw.push({ start: segStart, end: t })
        }
      }
      if (inSpeech) raw.push({ start: segStart, end: (n * win) / sampleRate })

      const merged = []
      for (const s of raw) {
        const last = merged[merged.length - 1]
        if (last && s.start - last.end < ALIGN.MERGE_GAP) last.end = s.end
        else merged.push({ start: s.start, end: s.end })
      }

      const dur = wavesurfer.getDuration() || (n * win) / sampleRate
      return merged
        .filter(s => s.end - s.start >= ALIGN.MIN_SEG)
        .map(s => ({
          start: Math.max(0, s.start - ALIGN.PAD),
          end: Math.min(dur, s.end + ALIGN.PAD),
        }))
    }

    // 2. 估全域偏移：字幕覆蓋率 vs 語音覆蓋率的互相關
    //    先把整體漂移拿掉，第 3 步的「貼近原始時間」軟約束才有意義
    function estimateGlobalOffset(subs, segs, duration) {
      const step = ALIGN.OFFSET_STEP
      const bins = Math.ceil(duration / step) + 1
      if (bins < 4) return 0
      const speech = new Uint8Array(bins)
      const sub = new Uint8Array(bins)
      const fill = (arr, items) => {
        for (const it of items) {
          const a = Math.max(0, Math.floor(it.start / step))
          const b = Math.min(bins - 1, Math.ceil(it.end / step))
          for (let i = a; i <= b; i++) arr[i] = 1
        }
      }
      fill(speech, segs)
      fill(sub, subs)

      const maxShift = Math.round(ALIGN.OFFSET_RANGE / step)
      let bestShift = 0
      let bestScore = -1
      for (let sh = -maxShift; sh <= maxShift; sh++) {
        let score = 0
        const lo = Math.max(0, -sh)
        const hi = Math.min(bins, bins - sh)
        for (let i = lo; i < hi; i++) score += sub[i] & speech[i + sh]
        // 輕微偏好 0：分數打平時不要無謂平移
        score -= Math.abs(sh) * 1e-4
        if (score > bestScore) { bestScore = score; bestShift = sh }
      }
      return bestShift * step
    }

    // 3. DP：把 N 條字幕單調分配到 M 個語音段
    //    雙向都要支援——多條字幕塞一段（Whisper 把一句切成好幾條），
    //    以及一條字幕跨多段（一句話中間有換氣，被切成兩三段語音）。
    //    只做前者的話，講一句話中間停頓的地方會被判成空段，後面整串跟著位移。
    function assignSubsToSegments(subs, segs, offset, maxShift) {
      const N = subs.length
      const M = segs.length
      const B = ALIGN.MAX_SUBS_PER_SEG
      const R = ALIGN.MAX_SEGS_PER_SUB

      const chars = subs.map(s => alignCharCount(s.text))
      const cum = new Float64Array(N + 1)
      for (let i = 0; i < N; i++) cum[i + 1] = cum[i] + Math.max(chars[i], 1)
      const totalChars = cum[N]

      // 語音時長前綴和（用來算合併後的「實際講話時間」，不含中間靜音）
      const segCum = new Float64Array(M + 1)
      for (let j = 0; j < M; j++) segCum[j + 1] = segCum[j] + (segs[j].end - segs[j].start)
      const secPerChar = segCum[M] / Math.max(1, totalChars)

      const band = Math.max(ALIGN.BAND_MIN, Math.round(N * ALIGN.BAND_RATIO))
      const W = N + 1
      const dp = new Float64Array((M + 1) * W).fill(Infinity)
      const backK = new Int32Array((M + 1) * W).fill(-1)
      const backR = new Int32Array((M + 1) * W)
      dp[0] = 0

      for (let j = 1; j <= M; j++) {
        const center = Math.round((j * N) / M)
        const iLo = Math.max(0, center - band)
        const iHi = Math.min(N, center + band)
        const row = j * W

        for (let i = iLo; i <= iHi; i++) {
          let best = Infinity
          let bestK = -1
          let bestR = 1

          for (let r = 1; r <= Math.min(R, j); r++) {
            const prow = (j - r) * W
            const segStart = segs[j - r].start
            const segEnd = segs[j - 1].end
            const span = segEnd - segStart              // 分配時間用（含中間靜音，字幕才不會閃）
            const speech = segCum[j] - segCum[j - r]    // 比對字數用（只算真的在講話的時間）

            // 空段只在 r=1 時有意義：這一段沒有任何字幕對應（笑聲、咳嗽、漏轉的話）
            if (r === 1) {
              const base = dp[prow + i]
              if (base !== Infinity) {
                const cost = base + ALIGN.EMPTY_SEG_COST * span
                if (cost < best) { best = cost; bestK = i; bestR = 1 }
              }
            }

            const kLo = Math.max(0, i - B)
            for (let k = kLo; k < i; k++) {
              const base = dp[prow + k]
              if (base === Infinity) continue

              // 位移要逐條算，不能拿整組的區間距離當代理：
              // 組的範圍涵蓋語音段時「距離」會是 0，組裡個別字幕照樣被搬走 33 秒（實測踩過）
              const total = cum[i] - cum[k]
              let shiftSum = 0
              let over = false
              for (let x = k; x < i; x++) {
                const newStart = segStart + (span * (cum[x] - cum[k])) / total
                // 錨點用 start 不用 end：Whisper 的 end 常把後面的靜音含進去
                const dd = Math.abs(newStart - (subs[x].start + offset))
                if (maxShift > 0 && dd > maxShift) { over = true; break }
                shiftSum += dd
              }
              if (over) continue

              const cost = base
                + Math.abs(speech - total * secPerChar)
                + shiftSum * ALIGN.TIME_WEIGHT
                + (r - 1) * ALIGN.MERGE_COST
              if (cost < best) { best = cost; bestK = k; bestR = r }
            }
          }

          dp[row + i] = best
          backK[row + i] = bestK
          backR[row + i] = bestR
        }
      }

      if (dp[M * W + N] === Infinity) return null

      // 回溯：每一筆是「哪幾段語音」配「哪幾條字幕」
      const plan = []
      let i = N
      let j = M
      let guard = 0
      while (j >= 1) {
        if (guard++ > M + 2) return null
        const k = backK[j * W + i]
        const r = backR[j * W + i] || 1
        if (k < 0) return null
        if (k < i) plan.push({ k, i, start: segs[j - r].start, end: segs[j - 1].end })
        i = k
        j -= r
      }
      return i === 0 && j === 0 ? plan.reverse() : null
    }

    // 4. 段內按字數比例切時間
    function applyAlignmentPlan(subs, plan) {
      const chars = subs.map(s => Math.max(alignCharCount(s.text), 1))
      for (const g of plan) {
        const span = g.end - g.start
        let total = 0
        for (let x = g.k; x < g.i; x++) total += chars[x]
        let acc = 0
        for (let x = g.k; x < g.i; x++) {
          const a = g.start + (span * acc) / total
          acc += chars[x]
          subs[x].start = a
          subs[x].end = g.start + (span * acc) / total
        }
      }
      // 收尾：最短時長、不交叉、小縫補滿（避免字幕閃爍）
      for (let x = 0; x < subs.length; x++) {
        if (subs[x].end - subs[x].start < ALIGN.MIN_DUR) {
          subs[x].end = subs[x].start + ALIGN.MIN_DUR
        }
        if (x > 0) {
          if (subs[x].start < subs[x - 1].end) subs[x].start = subs[x - 1].end
          if (subs[x].end <= subs[x].start) subs[x].end = subs[x].start + ALIGN.MIN_DUR
          const gap = subs[x].start - subs[x - 1].end
          if (gap > 0 && gap < ALIGN.GAP_FILL) subs[x - 1].end = subs[x].start
        }
      }
    }

    // 退路：DP 建不起來時，用「移除靜音的時間線」等比例映射
    function proportionalAlign(subs, segs) {
      const chars = subs.map(s => Math.max(alignCharCount(s.text), 1))
      const total = chars.reduce((a, b) => a + b, 0)
      const speechTotal = segs.reduce((a, s) => a + (s.end - s.start), 0)
      // 語音時間線 → 真實時間
      const toReal = p => {
        let want = p * speechTotal
        for (const s of segs) {
          const d = s.end - s.start
          if (want <= d) return s.start + want
          want -= d
        }
        return segs.length ? segs[segs.length - 1].end : 0
      }
      let acc = 0
      for (let x = 0; x < subs.length; x++) {
        const a = toReal(acc / total)
        acc += chars[x]
        const b = toReal(acc / total)
        subs[x].start = a
        subs[x].end = Math.max(b, a + ALIGN.MIN_DUR)
      }
    }

    function refreshAlignBtn() {
      if (!btnAlignAudio) return
      btnAlignAudio.disabled = !(wavesurfer && subtitles.length > 0)
    }

    function runAudioAlignment() {
      const segs = detectSpeechSegments()
      if (!segs || segs.length === 0) {
        return { ok: false, msg: '偵測不到語音段，可能音量太小或整段是靜音' }
      }
      const before = subtitles.map(s => ({ start: s.start, end: s.end }))
      const duration = wavesurfer.getDuration() || 0
      const offset = estimateGlobalOffset(subtitles, segs, duration)

      let mode = 'DP'
      const cells = (segs.length + 1) * (subtitles.length + 1)
      let plan = null
      let usedShift = 0
      if (cells <= ALIGN.MAX_CELLS) {
        // 位移上限由嚴到寬試：先試「只做局部微調」，無解才放寬
        for (const ms of ALIGN.SHIFT_RELAX) {
          plan = assignSubsToSegments(subtitles, segs, offset, ms)
          if (plan) { usedShift = ms; break }
        }
      }
      if (plan) {
        applyAlignmentPlan(subtitles, plan)
      } else {
        mode = '等比例'
        proportionalAlign(subtitles, segs)
      }

      let moved = 0
      let maxShift = 0
      const shifts = []
      for (let x = 0; x < subtitles.length; x++) {
        const d = Math.abs(subtitles[x].start - before[x].start)
        shifts.push(d)
        if (d > 0.05) moved++
        if (d > maxShift) maxShift = d
      }
      shifts.sort((a, b) => a - b)
      const median = shifts.length ? shifts[Math.floor(shifts.length / 2)] : 0

      return {
        ok: true,
        mode,
        usedShift,
        segs: segs.length,
        moved,
        total: subtitles.length,
        median,
        maxShift,
        offset,
      }
    }

    btnAlignAudio.addEventListener('click', () => {
      if (!wavesurfer || !wavesurfer.getDecodedData()) {
        showLoading('波形圖還沒解析完，等一下再按')
        setTimeout(hideLoading, 1800)
        return
      }
      if (subtitles.length === 0) {
        showLoading('請先載入 SRT')
        setTimeout(hideLoading, 1800)
        return
      }

      showLoading('對齊聲音中…')
      setTimeout(() => {
        let result
        try {
          result = runAudioAlignment()
        } catch (err) {
          console.error('[align]', err)
          result = { ok: false, msg: '對齊失敗：' + err.message }
        }

        if (!result.ok) {
          showLoading(result.msg)
          setTimeout(hideLoading, 2200)
          return
        }

        renderSubtitleList()
        renderRegions()
        if (activeRegion) {
          const sub = subtitles.find(s => s.id === activeRegion)
          if (sub) syncEditDrawer(sub)
        }
        pushHistory()

        const fmt = n => n.toFixed(2)
        console.log(
          `[align] 模式=${result.mode} 語音段=${result.segs} ` +
          `全域偏移=${fmt(result.offset)}s 調整=${result.moved}/${result.total} ` +
          `中位移動=${fmt(result.median)}s 最大=${fmt(result.maxShift)}s`
        )
        showLoading(
          `已對齊 ${result.moved}/${result.total} 條　` +
          `語音段 ${result.segs}　中位移動 ${fmt(result.median)}s　最大 ${fmt(result.maxShift)}s` +
          `${result.mode === '等比例' ? '（退回等比例模式）' : ''}　⌘Z 可復原`
        )
        setTimeout(hideLoading, 3200)
      }, 50)
    })


    // ── Auto split (台灣斷句) ──
    const MAX_CHARS = 16

    // Break points by priority: punctuation > particles > conjunctions
    const BREAK_AFTER = [
      '，', '。', '！', '？', '；', '：', '、',           // punctuation
      '⋯', '…',                                           // ellipsis
      '的', '了', '嗎', '啊', '呢', '吧', '喔', '耶',     // sentence-final particles
      '嘛', '囉', '哦', '欸', '哪', '唷',                 // more particles
      '就是', '然後', '所以', '但是', '因為', '可是',       // conjunctions
      '不過', '而且', '或是', '如果', '雖然', '還是',
      '那', '就', '也', '都', '才', '又', '再',           // short connectors
    ]

    function findBestBreak(text) {
      const mid = Math.floor(text.length / 2)
      let bestPos = -1
      let bestDist = Infinity

      // Try each break pattern, find the one closest to the middle
      for (const pattern of BREAK_AFTER) {
        let idx = -1
        let searchFrom = 0
        while ((idx = text.indexOf(pattern, searchFrom)) !== -1) {
          const breakPos = idx + pattern.length
          // Don't break if result would be too short (< 4 chars on either side)
          if (breakPos >= 4 && text.length - breakPos >= 4) {
            const dist = Math.abs(breakPos - mid)
            if (dist < bestDist) {
              bestDist = dist
              bestPos = breakPos
            }
          }
          searchFrom = idx + 1
        }
      }

      // Fallback: just split at middle
      if (bestPos === -1) bestPos = mid

      return bestPos
    }

    function autoSplitSubtitles() {
      let changed = false
      let i = 0

      while (i < subtitles.length) {
        const sub = subtitles[i]
        const text = sub.text.replace(/\n/g, ' ').trim()

        if (text.length > MAX_CHARS) {
          const breakPos = findBestBreak(text)
          const textBefore = text.slice(0, breakPos).trim()
          const textAfter = text.slice(breakPos).trim()

          if (textBefore && textAfter) {
            const ratio = breakPos / text.length
            const splitTime = sub.start + (sub.end - sub.start) * ratio
            const origEnd = sub.end

            sub.text = textBefore
            sub.end = splitTime

            const newSub = {
              id: `sub-${Date.now()}-${i}`,
              index: sub.index + 1,
              start: splitTime,
              end: origEnd,
              text: textAfter,
            }

            subtitles.splice(i + 1, 0, newSub)
            changed = true
            // Don't increment i — check the first half again in case it's still too long
            continue
          }
        }
        i++
      }

      if (changed) {
        // Re-index
        subtitles.forEach((s, idx) => { s.index = idx + 1 })
        renderSubtitleList()
        renderRegions()
        pushHistory()
      }

      return changed
    }

    btnAutoSplit.addEventListener('click', () => {
      const changed = autoSplitSubtitles()
      if (changed) {
        const count = subtitles.length
        btnAutoSplit.textContent = `已斷句 (${count} 條)`
        setTimeout(() => { btnAutoSplit.textContent = '自動斷句' }, 2000)
      } else {
        btnAutoSplit.textContent = '無需斷句'
        btnAutoSplit.disabled = true
        btnAutoSplit.style.opacity = '0.5'
        setTimeout(() => {
          btnAutoSplit.textContent = '自動斷句'
          btnAutoSplit.disabled = false
          btnAutoSplit.style.opacity = ''
        }, 2000)
      }
    })

    // ── Render regions ──
    function makeRegionLabel(text) {
      const el = document.createElement('span')
      el.textContent = text.split('\n')[0].slice(0, 40)
      el.style.cssText = 'font-size:10px;color:#fff;background:rgba(0,0,0,0.65);padding:2px 6px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;pointer-events:none;font-weight:500;margin:3px 0 0 3px;'
      return el
    }

    function renderRegions() {
      regions.clearRegions()
      subtitles.forEach((sub, i) => {
        regions.addRegion({
          id: sub.id,
          start: sub.start,
          end: sub.end,
          content: makeRegionLabel(sub.text),
          color: regionColors[i % regionColors.length],
          drag: true,
          resize: true,
        })
      })
      // Re-add cut markers if visible
      if (cutMarkersVisible) renderCutMarkers()
    }

    // ── Render subtitle list ──
    function renderSubtitleList() {
      if (subtitles.length === 0) {
        emptyState.style.display = 'flex'
        subtitleList.querySelectorAll('.subtitle-item').forEach(el => el.remove())
        return
      }

      emptyState.style.display = 'none'
      subtitleList.querySelectorAll('.subtitle-item').forEach(el => el.remove())

      subtitles.forEach((sub) => {
        const row = document.createElement('div')
        row.className = 'subtitle-item'
        row.dataset.id = sub.id
        const charLen = sub.text.replace(/\n/g, '').length
        row.innerHTML = `
          <span class="index">${sub.index}</span>
          <span class="sub-text-display" contenteditable="false">${escapeHtml(sub.text.replace(/\n/g, ' '))}</span>
          <span class="sub-time">${shortTime(sub.start)}</span>
          <span class="char-count ${charLen > 16 ? 'over' : ''}">${charLen}</span>
          <button class="delete-btn" title="刪除">×</button>
        `

        const textEl = row.querySelector('.sub-text-display')

        // Single click: select + jump to time
        row.addEventListener('click', (e) => {
          if (e.target.tagName === 'BUTTON') return
          if (textEl.contentEditable === 'true') return // don't interfere when editing
          setActiveRegion(sub.id)
          if (wavesurfer) wavesurfer.setTime(sub.start)
        })

        // Click on text: make editable
        textEl.addEventListener('click', (e) => {
          e.stopPropagation()
          setActiveRegion(sub.id)
          if (wavesurfer) wavesurfer.setTime(sub.start)
          textEl.contentEditable = 'true'
          textEl.focus()
        })

        // Enter: confirm edit; Escape: cancel
        textEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault()
            textEl.blur()
          } else if (e.key === 'Escape') {
            textEl.textContent = sub.text.replace(/\n/g, ' ')
            textEl.blur()
          }
        })

        // Click time code: open edit drawer to modify timing
        const timeEl = row.querySelector('.sub-time')
        timeEl.addEventListener('click', (e) => {
          e.stopPropagation()
          setActiveRegion(sub.id)
          openEditDrawer(sub)
        })

        // Save on blur
        textEl.addEventListener('blur', () => {
          textEl.contentEditable = 'false'
          const newText = textEl.textContent.trim()
          if (newText && newText !== sub.text) {
            sub.text = newText
            const region = regions.getRegions().find(r => r.id === sub.id)
            if (region) region.setOptions({ content: makeRegionLabel(sub.text) })
            pushHistory()
          } else {
            textEl.textContent = sub.text.replace(/\n/g, ' ')
          }
        })

        row.querySelector('.delete-btn').addEventListener('click', () => {
          subtitles = subtitles.filter(s => s.id !== sub.id)
          const region = regions.getRegions().find(r => r.id === sub.id)
          if (region) region.remove()
          row.remove()
          if (subtitles.length === 0) emptyState.style.display = 'flex'
          if (activeRegion === sub.id) closeEditDrawer()
          pushHistory()
        })

        subtitleList.appendChild(row)
      })
    }

    function updateSubtitleRowTime(sub) {
      const row = subtitleList.querySelector(`[data-id="${sub.id}"]`)
      if (!row) return
      row.querySelector('.sub-time').textContent = shortTime(sub.start)
    }

    function updateSubtitleRowText(sub) {
      const row = subtitleList.querySelector(`[data-id="${sub.id}"]`)
      if (!row) return
      row.querySelector('.sub-text-display').textContent = sub.text.replace(/\n/g, ' ')
      const charLen = sub.text.replace(/\n/g, '').length
      const countEl = row.querySelector('.char-count')
      if (countEl) {
        countEl.textContent = charLen
        countEl.classList.toggle('over', charLen > 16)
      }
    }

    function updateRegionTime(sub) {
      const region = regions.getRegions().find(r => r.id === sub.id)
      if (region) region.setOptions({ start: sub.start, end: sub.end })
    }

    // ── Edit drawer ──
    let editingSubId = null

    function openEditDrawer(sub) {
      editingSubId = sub.id
      editStart.value = secondsToSrtTime(sub.start)
      editEnd.value = secondsToSrtTime(sub.end)
      editText.value = sub.text.replace(/\n/g, ' ')
      editDrawer.classList.add('visible')
      editText.focus()
    }

    function syncEditDrawer(sub) {
      if (editingSubId !== sub.id) return
      editStart.value = secondsToSrtTime(sub.start)
      editEnd.value = secondsToSrtTime(sub.end)
    }

    function closeEditDrawer() {
      editingSubId = null
      editDrawer.classList.remove('visible')
    }

    editStart.addEventListener('change', () => {
      const sub = subtitles.find(s => s.id === editingSubId)
      if (!sub) return
      const t = srtTimeToSeconds(editStart.value)
      if (!isNaN(t)) { sub.start = t; updateRegionTime(sub); updateSubtitleRowTime(sub); pushHistory() }
      else editStart.value = secondsToSrtTime(sub.start)
    })

    editEnd.addEventListener('change', () => {
      const sub = subtitles.find(s => s.id === editingSubId)
      if (!sub) return
      const t = srtTimeToSeconds(editEnd.value)
      if (!isNaN(t)) { sub.end = t; updateRegionTime(sub); pushHistory() }
      else editEnd.value = secondsToSrtTime(sub.end)
    })

    editText.addEventListener('change', () => {
      const sub = subtitles.find(s => s.id === editingSubId)
      if (!sub) return
      sub.text = editText.value
      updateSubtitleRowText(sub)
      const region = regions.getRegions().find(r => r.id === sub.id)
      if (region) region.setOptions({ content: makeRegionLabel(sub.text) })
      pushHistory()
    })

    // Enter in edit text = split subtitle at cursor position
    editText.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return
      e.preventDefault()

      const sub = subtitles.find(s => s.id === editingSubId)
      if (!sub) return

      const cursor = editText.selectionStart
      const fullText = editText.value
      if (cursor === 0 || cursor === fullText.length) return

      const textBefore = fullText.slice(0, cursor).trim()
      const textAfter = fullText.slice(cursor).trim()
      if (!textBefore || !textAfter) return

      // Save original end before modifying
      const origEnd = sub.end
      const ratio = cursor / fullText.length
      const splitTime = sub.start + (origEnd - sub.start) * ratio

      // First half: update current subtitle
      sub.text = textBefore
      sub.end = splitTime

      // Second half: insert new subtitle
      const newId = `sub-${Date.now()}`
      const newSub = {
        id: newId,
        index: sub.index + 1,
        start: splitTime,
        end: origEnd,
        text: textAfter,
      }

      // Insert after current subtitle
      const idx = subtitles.indexOf(sub)
      subtitles.splice(idx + 1, 0, newSub)

      // Re-index all subtitles
      subtitles.forEach((s, i) => { s.index = i + 1 })

      // Re-render everything
      renderSubtitleList()
      renderRegions()
      pushHistory()

      // Open edit drawer on the new subtitle
      setActiveRegion(newId)
      openEditDrawer(newSub)
    })

    // ── Active region ──
    const ACTIVE_COLOR = 'rgba(34, 197, 94, 0.35)'
    const INACTIVE_COLOR_FN = (i) => regionColors[i % regionColors.length]

    function setActiveRegion(id) {
      const prevId = activeRegion
      activeRegion = id
      subtitleList.querySelectorAll('.subtitle-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id)
      })
      const activeEl = subtitleList.querySelector(`[data-id="${id}"]`)
      if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' })

      // Highlight active region on waveform
      if (regions) {
        // Reset previous
        if (prevId && prevId !== id) {
          const prevRegion = regions.getRegions().find(r => r.id === prevId)
          const prevIdx = subtitles.findIndex(s => s.id === prevId)
          if (prevRegion && prevIdx >= 0) {
            prevRegion.setOptions({ color: INACTIVE_COLOR_FN(prevIdx) })
          }
        }
        // Highlight current
        const curRegion = regions.getRegions().find(r => r.id === id)
        if (curRegion) {
          curRegion.setOptions({ color: ACTIVE_COLOR })
        }
      }

      // Update subtitle status bar
      const sub = subtitles.find(s => s.id === id)
      if (sub) {
        infoStart.textContent = `${secondsToSrtTime(sub.start).replace(',', '.')} → ${secondsToSrtTime(sub.end).replace(',', '.')}`
        const dur = (sub.end - sub.start).toFixed(2)
        infoDuration.textContent = `${dur} 秒`
        const chars = sub.text.replace(/\n/g, '').length
        const cps = dur > 0 ? (chars / dur).toFixed(1) : '0'
        infoChars.textContent = `${chars} 字　${cps} 字/秒`
      }
    }

    function renderKaraokeText(container, text, progress) {
      const chars = text.replace(/\n/g, ' ').split('')
      const currentIdx = Math.min(Math.floor(chars.length * progress), chars.length - 1)
      container.innerHTML = ''
      chars.forEach((ch, i) => {
        const span = document.createElement('span')
        span.textContent = ch
        if (i === currentIdx) {
          span.style.color = '#fff'
          span.style.background = 'rgba(34, 197, 94, 0.6)'
          span.style.borderRadius = '2px'
        } else {
          span.style.color = '#fff'
        }
        container.appendChild(span)
      })
    }

    let lastKaraokeId = null

    function clearKaraoke(subId) {
      if (!subId) return
      const row = subtitleList.querySelector(`[data-id="${subId}"]`)
      if (row) {
        const textEl = row.querySelector('.sub-text-display')
        if (textEl && textEl.contentEditable !== 'true') {
          const sub = subtitles.find(s => s.id === subId)
          if (sub) textEl.textContent = sub.text.replace(/\n/g, ' ')
        }
      }
    }

    function highlightCurrentSubtitle() {
      if (!wavesurfer) return
      const time = wavesurfer.getCurrentTime()
      const current = subtitles.find(s => time >= s.start && time <= s.end)
      if (current) {
        // Clear previous karaoke if switching to a different subtitle
        if (lastKaraokeId && lastKaraokeId !== current.id) {
          clearKaraoke(lastKaraokeId)
        }
        lastKaraokeId = current.id

        setActiveRegion(current.id)
        const progress = (time - current.start) / (current.end - current.start)

        // Video subtitle: karaoke
        videoSubtitle.classList.add('visible')
        renderKaraokeText(videoSubtitle, current.text, progress)

        // Subtitle list: karaoke on active row
        const row = subtitleList.querySelector(`[data-id="${current.id}"]`)
        if (row) {
          const textEl = row.querySelector('.sub-text-display')
          if (textEl && textEl.contentEditable !== 'true') {
            const chars = current.text.replace(/\n/g, ' ').split('')
            const currentCharIdx = Math.min(Math.floor(chars.length * progress), chars.length - 1)
            textEl.innerHTML = ''
            chars.forEach((ch, i) => {
              const span = document.createElement('span')
              span.textContent = ch
              if (i === currentCharIdx) {
                span.style.background = 'rgba(34, 197, 94, 0.35)'
                span.style.borderRadius = '2px'
              }
              textEl.appendChild(span)
            })
          }
        }
      } else {
        // No current subtitle — clear previous karaoke
        if (lastKaraokeId) {
          clearKaraoke(lastKaraokeId)
          lastKaraokeId = null
        }
        videoSubtitle.classList.remove('visible')
      }
    }

    function updateTimeDisplay() {
      if (!wavesurfer) return
      const c = wavesurfer.getCurrentTime()
      const d = wavesurfer.getDuration()
      timeDisplay.textContent = `${secondsToSrtTime(c).replace(',', '.')} / ${secondsToSrtTime(d).replace(',', '.')}`
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }

    // ── Search & Replace ──
    const replaceRow = $('#replace-row')
    const replaceInput = $('#replace-input')
    const btnReplaceAll = $('#btn-replace-all')
    const matchCount = $('#match-count')

    function doSearch() {
      const q = searchInput.value
      const ql = q.toLowerCase()

      // Show/hide replace row
      replaceRow.classList.toggle('visible', q.length > 0)

      let total = 0
      subtitleList.querySelectorAll('.subtitle-item').forEach(el => {
        const textEl = el.querySelector('.sub-text-display')
        if (!textEl) return
        const sub = subtitles.find(s => s.id === el.dataset.id)
        if (!sub) return

        const text = sub.text.replace(/\n/g, ' ')

        if (q && text.toLowerCase().includes(ql)) {
          el.style.display = ''
          // Count matches in this subtitle
          let count = 0
          let idx = text.toLowerCase().indexOf(ql)
          while (idx !== -1) {
            count++
            idx = text.toLowerCase().indexOf(ql, idx + 1)
          }
          total += count

          // Highlight matches
          if (textEl.contentEditable !== 'true') {
            const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            const regex = new RegExp(`(${escaped})`, 'gi')
            textEl.innerHTML = escapeHtml(text).replace(regex, '<mark>$1</mark>')
          }
        } else if (q) {
          el.style.display = 'none'
          if (textEl.contentEditable !== 'true') {
            textEl.textContent = text
          }
        } else {
          el.style.display = ''
          if (textEl.contentEditable !== 'true') {
            textEl.textContent = text
          }
        }
      })

      matchCount.textContent = q ? `${total} 處` : ''
    }

    const searchClear = $('#search-clear')

    searchInput.addEventListener('input', () => {
      searchClear.classList.toggle('visible', searchInput.value.length > 0)
      doSearch()
    })

    searchClear.addEventListener('click', () => {
      searchInput.value = ''
      searchClear.classList.remove('visible')
      doSearch()
      searchInput.focus()
    })

    btnReplaceAll.addEventListener('click', () => {
      const q = searchInput.value
      const r = replaceInput.value
      if (!q) return

      let count = 0
      subtitles.forEach(sub => {
        const regex = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')
        const newText = sub.text.replace(regex, (match) => { count++; return r })
        if (newText !== sub.text) {
          sub.text = newText
        }
      })

      if (count > 0) {
        renderSubtitleList()
        renderRegions()
        pushHistory()
        // Re-run search to update highlights
        doSearch()
        btnReplaceAll.textContent = `已取代 ${count} 處`
        setTimeout(() => { btnReplaceAll.textContent = '全部取代' }, 2000)
      }
    })

    // ── Load media ──
    function loadMedia(file) {
      showLoading('載入媒體中...')
      const url = URL.createObjectURL(file)
      const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|mkv|avi)$/i.test(file.name)

      if (isVideo) {
        videoPreview.src = url
        videoPanel.classList.add('visible')
        // Set video panel width based on available space (50% of main content)
        videoPanel.style.width = '60%'
        initWaveSurfer(videoPreview)
      } else {
        videoPanel.classList.remove('visible')
        videoPanel.style.width = ''
        initWaveSurfer()
        wavesurfer.load(url)
      }

      mediaFileName = file.name
      fileInfo.textContent = subtitles.length > 0 ? file.name + ' + ' + srtFileName + '.srt' : file.name
      btnExport.disabled = false
      btnCutDetect.disabled = false
      refreshAlignBtn()
      // Reset cut markers when loading new media
      cutMarkersVisible = false
      cutMarkers = []
      cutMarkerEls.forEach(el => el.remove())
      cutMarkerEls = []
      btnCutDetect.classList.remove('active')
      btnCutDetect.textContent = '切點偵測'
    }

    // ── Load SRT ──
    let mediaFileName = ''

    function loadSRT(file) {
      showLoading('載入字幕中...')
      srtFileName = file.name.replace(/\.srt$/i, '')
      const reader = new FileReader()
      reader.onload = (e) => {
        // Clear old state
        subtitles = []
        activeRegion = null
        if (regions) regions.clearRegions()
        closeEditDrawer()

        // Load new
        subtitles = parseSRT(e.target.result)
        renderSubtitleList()
        if (wavesurfer && wavesurfer.getDuration()) renderRegions()
        fileInfo.textContent = mediaFileName ? mediaFileName + ' + ' + file.name : file.name
        btnExport.disabled = false
        btnAutoSplit.disabled = false
        refreshAlignBtn()
        undoStack.length = 0
        historyIndex = -1
        pushHistory()

        // Reset cut detection
        cutMarkersVisible = false
        cutMarkers = []
        btnCutDetect.classList.remove('active')
        btnCutDetect.textContent = '切點偵測'
        btnPrevSub.style.display = 'none'
        btnNextSub.style.display = 'none'
        btnSnapOne.style.display = 'none'
        btnSnapAll.style.display = 'none'

        // Auto-zoom: target ~30 seconds visible at a time
        if (wavesurfer && subtitles.length > 0) {
          const waveformWidth = document.getElementById('waveform').clientWidth
          const targetVisible = 30 // seconds visible at once
          const pxPerSec = waveformWidth / targetVisible
          wavesurfer.zoom(pxPerSec)
          zoomSlider.value = Math.min(pxPerSec, 500)
        }
        hideLoading()
      }
      reader.readAsText(file)
    }

    // ── Button handlers ──
    btnLoadMedia.addEventListener('click', () => inputMedia.click())
    btnLoadSrt.addEventListener('click', () => inputSrt.click())
    inputMedia.addEventListener('change', (e) => { if (e.target.files[0]) loadMedia(e.target.files[0]) })
    inputSrt.addEventListener('change', (e) => { if (e.target.files[0]) loadSRT(e.target.files[0]) })
    btnPlay.addEventListener('click', () => { if (wavesurfer) wavesurfer.playPause() })

    btnExport.addEventListener('click', () => {
      const srt = exportSRT()
      const blob = new Blob([srt], { type: 'text/plain;charset=utf-8' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = `${srtFileName}_edit.srt`
      a.click()
      URL.revokeObjectURL(url)
    })

    speedSelect.addEventListener('change', () => {
      if (wavesurfer) {
        const rate = parseFloat(speedSelect.value)
        wavesurfer.setPlaybackRate(rate)
        showSpeedToast(rate)
      }
    })

    zoomSlider.addEventListener('input', () => {
      if (wavesurfer) wavesurfer.zoom(Number(zoomSlider.value))
    })
    zoomSlider.addEventListener('change', () => {
      zoomSlider.blur()
    })

    // ── Keyboard shortcuts ──
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'z') {
        e.preventDefault()
        if (e.shiftKey) redo(); else undo()
        return
      }
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault()
        if (!btnExport.disabled) btnExport.click()
        return
      }
      // Space = play/pause globally, unless typing in a text input
      if (e.code === 'Space' && e.target.type !== 'text' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault()
        if (wavesurfer) wavesurfer.playPause()
        return
      }
      const isEditing = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || e.target.contentEditable === 'true'
      if (isEditing) {
        if (e.key === 'Escape') { e.target.blur(); closeEditDrawer() }
        return
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault()
        if (wavesurfer) wavesurfer.skip(-5)
      } else if (e.key === 'ArrowRight') {
        e.preventDefault()
        if (wavesurfer) wavesurfer.skip(5)
      } else if (e.key === '>' && e.shiftKey) {
        e.preventDefault()
        if (wavesurfer) {
          const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4]
          const cur = wavesurfer.getPlaybackRate()
          const next = speeds.find(s => s > cur) || speeds[speeds.length - 1]
          wavesurfer.setPlaybackRate(next)
          speedSelect.value = next
          showSpeedToast(next)
        }
      } else if (e.key === '<' && e.shiftKey) {
        e.preventDefault()
        if (wavesurfer) {
          const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4]
          const cur = wavesurfer.getPlaybackRate()
          const prev = [...speeds].reverse().find(s => s < cur) || speeds[0]
          wavesurfer.setPlaybackRate(prev)
          speedSelect.value = prev
          showSpeedToast(prev)
        }
      } else if (e.key === 'Escape') {
        closeEditDrawer()
      } else if ((e.key === 'Delete' || e.key === 'Backspace') && activeRegion) {
        e.preventDefault()
        const sub = subtitles.find(s => s.id === activeRegion)
        if (!sub) return
        subtitles = subtitles.filter(s => s.id !== activeRegion)
        const region = regions.getRegions().find(r => r.id === activeRegion)
        if (region) region.remove()
        subtitles.forEach((s, i) => { s.index = i + 1 })
        activeRegion = null
        renderSubtitleList()
        closeEditDrawer()
        pushHistory()
      }
    })

    // ── Timeline ruler click/drag to seek ──
    const timelineEl = document.getElementById('waveform-timeline')
    function seekFromTimeline(e) {
      if (!wavesurfer) return
      const rect = timelineEl.getBoundingClientRect()
      const x = e.clientX - rect.left
      const ratio = x / rect.width
      const duration = wavesurfer.getDuration()
      if (duration) wavesurfer.setTime(ratio * duration)
    }

    let timelineDragging = false
    timelineEl.addEventListener('mousedown', (e) => {
      timelineDragging = true
      seekFromTimeline(e)
    })
    document.addEventListener('mousemove', (e) => {
      if (timelineDragging) seekFromTimeline(e)
    })
    document.addEventListener('mouseup', () => {
      timelineDragging = false
    })

    // ── Horizontal scroll on waveform = scrub playhead ──
    const waveformEl = document.getElementById('waveform')
    waveformEl.addEventListener('wheel', (e) => {
      if (!wavesurfer || !e.deltaX) return
      // Only intercept horizontal scroll when not zoomed (no native scrollbar)
      const hasScrollbar = waveformEl.scrollWidth > waveformEl.clientWidth
      if (hasScrollbar) return // let native scroll handle it when zoomed

      e.preventDefault()
      const duration = wavesurfer.getDuration()
      if (!duration) return
      const current = wavesurfer.getCurrentTime()
      const step = duration * 0.01 * Math.sign(e.deltaX) // 1% per scroll tick
      const newTime = Math.max(0, Math.min(duration, current + step))
      wavesurfer.setTime(newTime)
    }, { passive: false })

    timelineEl.addEventListener('wheel', (e) => {
      if (!wavesurfer || !e.deltaX) return
      e.preventDefault()
      const duration = wavesurfer.getDuration()
      if (!duration) return
      const current = wavesurfer.getCurrentTime()
      const step = duration * 0.01 * Math.sign(e.deltaX)
      const newTime = Math.max(0, Math.min(duration, current + step))
      wavesurfer.setTime(newTime)
    }, { passive: false })

    // ── Drag & drop ──
    let dragCounter = 0

    document.addEventListener('dragenter', (e) => {
      e.preventDefault()
      dragCounter++
      dropOverlay.classList.add('visible')
    })
    document.addEventListener('dragleave', (e) => {
      e.preventDefault()
      dragCounter--
      if (dragCounter === 0) dropOverlay.classList.remove('visible')
    })
    document.addEventListener('dragover', (e) => e.preventDefault())
    document.addEventListener('drop', (e) => {
      e.preventDefault()
      dragCounter = 0
      dropOverlay.classList.remove('visible')
      let mediaFile = null
      let srtFile = null
      for (const file of e.dataTransfer.files) {
        if (file.name.endsWith('.srt')) srtFile = file
        else if (file.type.startsWith('audio/') || file.type.startsWith('video/') || /\.(mp3|wav|ogg|m4a|flac|aac|webm|mp4|mov|mkv|avi)$/i.test(file.name)) mediaFile = file
      }
      // Load media first, then SRT after wavesurfer is ready
      if (mediaFile && srtFile) {
        loadMedia(mediaFile)
        wavesurfer.once('ready', () => loadSRT(srtFile))
      } else if (mediaFile) {
        loadMedia(mediaFile)
      } else if (srtFile) {
        loadSRT(srtFile)
      }
    })
  </script>
</body>
</html>
